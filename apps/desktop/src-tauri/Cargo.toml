[package]
name = "samix-agent"
version = "0.1.0"
description = "SAMIX Agent - local autonomous computer agent"
authors = ["SamixTech"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "samix_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"

[profile.release]
# A local utility that sits in the tray: optimise for size and startup, and
# strip symbols. Spec §90 asks for a light idle footprint.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
